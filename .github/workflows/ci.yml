# CI — Fase 0: apenas testes.
# Fase 3 adicionará: Auth GCP -> Build & Push (Artifact Registry) -> Deploy Cloud Run
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Tests
        run: uv run pytest tests/
